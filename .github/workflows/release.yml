name: Build & Release Chrome Extension

on:
  push:
    tags:
      - 'v*' # Matches any tag starting with v

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - run: npm ci
    - run: npm run build
      
    - name: Package extension
      run: |
        mkdir chrome-extension
        cp dist/manifest.json chrome-extension/
        cp dist/popup.html chrome-extension/
        cp dist/popup.css chrome-extension/
        cp dist/popup.js chrome-extension/
        cp -r dist/icons chrome-extension/
        cd chrome-extension
        zip -r ../prettiefy-graphql-chrome-extension.zip *
        cd ..
        echo "ZIP contents:"
        unzip -l prettiefy-graphql-chrome-extension.zip
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: prettiefy-graphql-chrome-extension.zip
        name: "Prettiefy GraphQL ${{ github.ref_name }}"
        body: |
          ## Download & Install

          > **⚠️ Download `prettiefy-graphql-chrome-extension.zip` below — NOT the "Source code" links!**

          ### Steps
          1. Download `prettiefy-graphql-chrome-extension.zip` from the **Assets** section below
          2. Extract the ZIP
          3. Open Chrome → `chrome://extensions/`
          4. Enable **Developer mode** (top-right)
          5. Click **Load unpacked** → select the extracted folder
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}