name: Create Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build extension
      run: npm run build
      
    - name: Verify build output
      run: |
        echo "Checking if dist directory exists and has content:"
        ls -la dist/
        echo "Size of dist directory:"
        du -sh dist/
        
    - name: Create extension ZIP (only extension files)
      run: |
        cd dist
        zip -r ../prettiefy-graphql-extension-${{ github.ref_name }}.zip *
        cd ..
        echo "Created ZIP with contents:"
        unzip -l prettiefy-graphql-extension-${{ github.ref_name }}.zip
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          prettiefy-graphql-extension-${{ github.ref_name }}.zip
        body: |
          ## 🚀 Chrome Extension Release ${{ github.ref_name }}
          
          ### 📦 Installation Instructions
          1. Download `prettiefy-graphql-extension-${{ github.ref_name }}.zip` below
          2. **Extract the ZIP file** to a folder
          3. Open Chrome → `chrome://extensions/`
          4. Enable **Developer mode** (top right toggle)
          5. Click **"Load unpacked"** → Select the extracted folder
          6. The extension icon appears in your toolbar! 🎉
          
          ### 📁 ZIP Contents
          The ZIP contains only the built extension files:
          - `manifest.json` - Extension configuration
          - `popup.html`, `popup.css`, `popup.js` - Extension UI and logic  
          - `icons/` - Extension icons
          - No source code or build files included
          
          ### ✨ Features
          - 🔒 **100% Local** - No data leaves your browser
          - 🎨 **Syntax Highlighting** - Beautiful GraphQL formatting
          - 📋 **One-Click Copy** - Copy formatted queries instantly
          - ⚡ **Real-Time** - Format as you type
          
          ### 🔒 Privacy
          This extension processes all data locally - no external requests or tracking.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}