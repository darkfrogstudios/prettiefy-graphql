name: Build Chrome Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build extension
      run: npm run build
      
    - name: Debug - Check what was built
      run: |
        echo "=== CHECKING BUILD OUTPUT ==="
        echo "Current directory contents:"
        ls -la
        echo ""
        echo "Dist directory exists?"
        if [ -d "dist" ]; then
          echo "✅ Yes, dist directory exists"
          echo "Dist contents:"
          ls -la dist/
          echo ""
          echo "File sizes in dist:"
          du -sh dist/*
        else
          echo "❌ No dist directory found!"
          exit 1
        fi
      
    - name: Create extension-only ZIP
      run: |
        echo "=== CREATING EXTENSION ZIP ==="
        
        # Create a temporary directory for the extension files
        mkdir -p extension-package
        
        # Copy ONLY the built extension files
        cp dist/manifest.json extension-package/
        cp dist/popup.html extension-package/
        cp dist/popup.css extension-package/
        cp dist/popup.js extension-package/
        cp -r dist/icons extension-package/
        
        # Verify what we're about to zip
        echo "Extension package contents:"
        ls -la extension-package/
        echo ""
        echo "File sizes:"
        du -sh extension-package/*
        
        # Create the ZIP from the clean extension files
        cd extension-package
        zip -r ../prettiefy-graphql-extension.zip *
        cd ..
        
        # Verify the final ZIP
        echo ""
        echo "=== FINAL ZIP VERIFICATION ==="
        echo "ZIP file size:"
        ls -lh prettiefy-graphql-extension.zip
        echo ""
        echo "ZIP contents:"
        unzip -l prettiefy-graphql-extension.zip
        
    - name: Upload extension artifact
      uses: actions/upload-artifact@v4
      with:
        name: chrome-extension
        path: prettiefy-graphql-extension.zip