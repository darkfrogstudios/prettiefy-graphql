name: Build Chrome Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build extension
      run: npm run build
      
    - name: Verify dist contents
      run: |
        echo "Contents of dist directory:"
        ls -la dist/
        
    - name: Create extension ZIP (only dist contents)
      run: |
        cd dist
        zip -r ../prettiefy-graphql-extension.zip *
        cd ..
        echo "ZIP created. Contents:"
        unzip -l prettiefy-graphql-extension.zip
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: chrome-extension
        path: prettiefy-graphql-extension.zip
        
    - name: Upload to release (if this is a release)
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./prettiefy-graphql-extension.zip
        asset_name: prettiefy-graphql-extension.zip
        asset_content_type: application/zip